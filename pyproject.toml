[project]
name = "alert-disposition"
version = "0.1.0"
description = "ML stage that scores whether an alert needs investigation, for automated alert disposition in SentinelOne environments."
readme = "README.md"
authors = [{ name = "Edir Garcia Lazo", email = "edir.garcialazo@sentinelone.com" }]
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "mlflow>=2.17",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "typer>=0.12",
    "joblib>=1.4",
    "scipy>=1.18.1",
]

[project.scripts]
alertml = "alert_disposition.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4",
    "pandas-stubs",
    "types-pyyaml",
]
notebook = ["jupyterlab>=4.2", "matplotlib>=3.9", "seaborn>=0.13", "ipykernel>=6.29"]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY", "PD"]
ignore = ["E501"]  # line length handled by the formatter

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: slower tests"]
