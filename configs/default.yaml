# Root experiment config. Override via: alertml train --config configs/default.yaml -o model.params.n_estimators=500
experiment_name: alert-disposition
run_name: baseline
seed: 42

data:
  source: synthetic            # synthetic | parquet
  raw_path: data/raw/alerts.parquet
  processed_dir: data/processed
  payload_col: alert           # raw alert payload: JSON string (rawData) or dict
  source_format: ocsf          # adapter name (features.adapters)
  label_col: needs_investigation  # 0/1; 1 = should have been investigated. NOT TP/FP
  time_col: created_at
  id_col: alert_id
  n_synthetic: 5000
  split:
    strategy: time             # time | random  (time avoids leakage from repeated alert patterns)
    test_frac: 0.2
    val_frac: 0.1

features:
  experiment: E3               # E0 structured | E1 +path | E2 +command | E3 +text | E4 +attack/metadata
  include_confidence: false    # only once confidence_id is confirmed available pre-ML
  ocsf_full_path_key: path     # synthetic data only; the real full-path field is unvalidated
  # attack_fields / metadata_allowlist: allowlist-only, fill after inspecting real payloads
  path: {min_df: 10}
  command: {min_df: 10}
  text: {min_df: 10, max_features: 10000, ngram_range: [1, 2]}

model:
  name: lightgbm               # lightgbm | logreg
  params:
    n_estimators: 300
    learning_rate: 0.05
    num_leaves: 31
    class_weight: balanced

evaluation:
  primary_metric: auto_dispose_rate
  # Max share of should-investigate alerts we accept auto-disposing (missed-investigation rate).
  max_missed_investigation_rate: 0.01
  group_cols: [source, tenant_id]   # diagnostic breakdowns only, never features

mlflow:
  tracking_uri: sqlite:///experiments/mlflow.db
